<div class="comments-section">
    <h3>Komentar</h3>
    
    <!-- Form Komentar -->
    <form id="commentForm">
        <div id="emailInputWrapper" class="form-group">
            <input type="email" id="commentEmail" placeholder="Email Anda (Nama & centang biru otomatis)" required>
        </div>
        
        <!-- Notifikasi Email Terverifikasi -->
        <div id="emailVerifiedNotice" class="verified-notice" style="display: none;"></div>

        <div class="form-group">
            <textarea id="commentMessage" placeholder="Tulis komentar Anda di sini..." rows="4" required></textarea>
        </div>

        <div class="form-group" id="newsletterWrapper">
            <label>
                <input type="checkbox" id="newsletterCheckbox"> Berlangganan update artikel terbaru via email ini
            </label>
        </div>

        <input type="hidden" id="replyParentId" value="">
        <button type="submit" id="submitCommentBtn">Kirim Komentar</button>
        
        <!-- Peringatan Batas Harian -->
        <div id="commentLimitNotice"></div>
    </form>
    
    <!-- Daftar Komentar -->
    <div id="commentsList"></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const slug = window.currentSlug || window.location.pathname;
    checkUserSession();
    loadComments(slug);
});

function checkUserSession() {
    const savedEmail = localStorage.getItem('user_comment_email');
    
    if (savedEmail) {
        document.getElementById('commentEmail').value = savedEmail;
        document.getElementById('emailInputWrapper').style.display = 'none';
        document.getElementById('newsletterWrapper').style.display = 'none';
        
        const notice = document.getElementById('emailVerifiedNotice');
        notice.style.display = 'block';
        notice.innerHTML = `🔒 Komentar diamankan dengan email terverifikasi: <strong>${savedEmail}</strong>`;
    }

    checkDailyLimit();
}

function checkDailyLimit() {
    const today = new Date().toISOString().slice(0, 10);
    const limitData = JSON.parse(localStorage.getItem('daily_comment_limit') || '{}');
    
    if (limitData.date === today && limitData.count >= 5) {
        lockFormForLimit();
    }
}

function lockFormForLimit() {
    const btn = document.getElementById('submitCommentBtn');
    const notice = document.getElementById('commentLimitNotice');
    
    if (btn) btn.disabled = true;
    if (notice) {
        notice.innerHTML = `
            <div style="background: #fffaf0; border: 1px solid #feebc8; color: #c05621; padding: 10px 14px; border-radius: 6px; font-size: 0.85rem; margin-top: 0.75rem;">
                ⚠️ Batas pengiriman komentar harian Anda (maksimal 5 kali) telah tercukupi untuk hari ini. Anda tetap dapat membaca semua komentar dan balasan yang ada.
            </div>`;
    }
}

async function loadComments(slug) {
    const listContainer = document.getElementById('commentsList');
    listContainer.innerHTML = '<p style="color: #666; font-size: 13px;">Memuat komentar...</p>';

    try {
        const response = await fetch(`/api/comments?slug=${encodeURIComponent(slug)}`);
        const comments = await response.json();

        if (comments.length === 0) {
            listContainer.innerHTML = '<p style="color: #666; font-size: 13px;">Belum ada komentar. Jadilah yang pertama berkomentar!</p>';
            return;
        }

        const likedComments = JSON.parse(localStorage.getItem('liked_comments') || '[]');

        listContainer.innerHTML = comments.map(c => {
            const avatarUrl = `https://ui-avatars.com/api/?name=${encodeURIComponent(c.name)}&background=random&color=fff&size=128&bold=true`;
            
            const verifiedBadge = `
                <span title="Email Terverifikasi" style="display: inline-flex; align-items: center; margin-left: 4px; color: #1a73e8;">
                    <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor">
                        <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/>
                    </svg>
                </span>
            `;

            const cardClass = c.parent_id ? 'comment-card is-reply' : 'comment-card';
            const isLiked = likedComments.includes(c.id);
            const likeBtnStyle = isLiked ? 'color: #e0245e; font-weight: bold; cursor: default;' : 'color: #e0245e; cursor: pointer;';

            return `
                <div class="${cardClass}">
                    <div class="comment-header">
                        <img src="${avatarUrl}" alt="Avatar">
                        <div>
                            <div style="display: flex; align-items: center; font-weight: bold; font-size: 14px; color: #333;">
                                ${escapeHtml(c.name)} ${verifiedBadge}
                            </div>
                            <div style="font-size: 11px; color: #777;">${formatLocalDateTime(c.created_at)}</div>
                        </div>
                    </div>
                    <p>${escapeHtml(c.message)}</p>
                    <div style="display: flex; gap: 15px; font-size: 12px;">
                        <button onclick="likeComment(${c.id})" style="${likeBtnStyle}">❤️ Suka (${c.likes || 0})</button>
                        <button onclick="prepareReply(${c.id}, '${escapeHtml(c.name)}')">Balas</button>
                    </div>
                </div>
            `;
        }).join('');
    } catch (err) {
        listContainer.innerHTML = '<p style="color: red; font-size: 13px;">Gagal memuat komentar.</p>';
    }
}

document.getElementById('commentForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const today = new Date().toISOString().slice(0, 10);
    let limitData = JSON.parse(localStorage.getItem('daily_comment_limit') || '{}');
    if (limitData.date !== today) {
        limitData = { date: today, count: 0 };
    }
    if (limitData.count >= 5) {
        alert('Batas pengiriman komentar harian Anda sudah tercukupi.');
        lockFormForLimit();
        return;
    }

    const email = document.getElementById('commentEmail').value.trim();
    const message = document.getElementById('commentMessage').value.trim();
    const subscribe = document.getElementById('newsletterCheckbox') ? document.getElementById('newsletterCheckbox').checked : false;
    const parent_id = document.getElementById('replyParentId').value || null;
    const slug = window.currentSlug || window.location.pathname;

    try {
        const response = await fetch('/api/comments', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ slug, email, message, parent_id, subscribe })
        });
        const result = await response.json();
        
        if (result.success) {
            localStorage.setItem('user_comment_email', email);

            limitData.count += 1;
            localStorage.setItem('daily_comment_limit', JSON.stringify(limitData));

            document.getElementById('commentMessage').value = '';
            document.getElementById('replyParentId').value = '';
            
            loadComments(slug);
            checkUserSession();
        } else {
            alert('Gagal: ' + (result.error || 'Terjadi kesalahan'));
        }
    } catch (err) {
        alert('Terjadi kesalahan jaringan.');
    }
});

async function likeComment(id) {
    const likedComments = JSON.parse(localStorage.getItem('liked_comments') || '[]');
    if (likedComments.includes(id)) {
        return; // Mencegah spam klik like berulang kali
    }

    try {
        const response = await fetch('/api/comments', {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id })
        });
        const result = await response.json();
        if (result.success) {
            likedComments.push(id);
            localStorage.setItem('liked_comments', JSON.stringify(likedComments));
            loadComments(window.currentSlug || window.location.pathname);
        }
    } catch (err) {
        console.error('Gagal menyukai');
    }
}

function prepareReply(parentId, authorName) {
    document.getElementById('replyParentId').value = parentId;
    const textarea = document.getElementById('commentMessage');
    textarea.placeholder = `Membalas @${authorName}...`;
    textarea.focus();
}

function escapeHtml(text) {
    if (!text) return '';
    const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
    return text.toString().replace(/[&<>"']/g, m => map[m]);
}

function formatLocalDateTime(dateString) {
    if (!dateString) return '';
    const date = new Date(dateString + ' UTC');
    return date.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}
      </script>
